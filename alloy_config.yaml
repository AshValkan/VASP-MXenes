# ============================================================================
#  合金化 MXene 电子结构调控与超级电容器储能性能研究
#  理论计算部分 —— 体系定义与计算参数
#
#  研究体系:  Ti_(3-y) V_y C2 O2      (n = 2, O 终止, ABC 堆垛, H_M 空位)
#  实验对应:  MAX 前驱体 (Ti,V)3AlC2 -> LiF/HCl 刻蚀 -> Ti_(3-y)V_yC2Tx
#
#  本文件是**唯一**的体系定义来源。改这里，然后:
#      python run_alloy.py --config alloy_config.yaml
#  不要在脚本里硬编码参数 —— 论文里每个数字都要能追溯到这里。
# ============================================================================

system:
  host: Ti                 # 主体 M 元素
  dopant: V                # 客体 M 元素
  n: 2                     # MXene 宽度 (2 -> M3X2)
  X: C                     # C 或 N
  T: O2                    # 终止基团: "" (无) / O2 / F2 / O2H2
  stacking: ABC            # ABC 或 ABA
  hollows: HM              # HM(FCC, 最稳定) / H(HCP) / HX / HMX

  # V 含量 y（每个 M3 化学式单位中的 V 原子数）
  #   0.0 -> Ti3C2O2      对照组
  #   0.5 -> Ti2.5V0.5C2
  #   1.0 -> Ti2VC2
  #   1.5 -> Ti1.5V1.5C2  接近固溶上限
  # 文献: (Ti1-xVx)3AlC2 中 x > 0.6 (即 y > 1.8) 会破坏 MAX 相稳定性
  ys: [0.0, 0.5, 1.0, 1.5]

  # 超胞。y 为分数时需要公度的超胞: 2x2 面积=4, 需 4*y 为整数 -> 全部满足
  # 若改用 3x3 (面积 9), y=0.5 需要 4.5 个 V -> 不可行
  supercell: [2, 2, 1]

  # 占位模式
  #   outer        V 优先占据外层 M(1)/M(3)（上下表面对称分配）
  #   inner        V 优先占据中间层 M(2)
  #   random       全 M 位随机（seeded，可复现）
  #   random-outer 仅外层随机       random-inner 仅内层随机
  #   sqs          随机采样 + 对关联无序度最优（SQS-lite）
  #   cluster      V 团簇聚集（对照组，证明分散更有利）
  patterns: [outer, inner, sqs]

  seed: 42                 # 随机模式种子 —— 保证结果可复现

geometry:
  vacuum: 20.0             # 真空层厚度 (A)。功函数计算建议 >= 20
  interlayer: 2.5          # 初始层间距 do (A)，优化后会变
  lattice_scale: 3.0       # 初始晶格参数 a = 3.0 * sx (A)

dft:
  encut: 550               # 平面波截断能 (eV)
  vdw: d3                  # d3 / d3bj / d2 / optb86b / none
  spin: true
  ediff: 1.0e-06           # 电子步收敛 (eV)
  ediffg: -0.01            # 力收敛 (eV/A)
  sigma: 0.05
  lorbit: 11               # 必需: lm 分解 PDOS，dband.py 依赖它
  nedos: 5000
  dipole: true             # LDIPOL/IDIPOL=3，slab 必需

  # Hubbard U_eff (eV, Dudarev 形式, LDAUTYPE=2)
  # 论文方案: U(Ti-3d) = 2.5 eV, U(V-3d) = 2.5 eV
  # 建议做 U = 0 / 2 / 3 eV 的敏感性分析，并在正文说明选择依据
  hubbard_u:
    Ti: 2.5
    V: 2.5

  # k 点: 针对**原胞**给定，超胞会自动除以 sx, sy 保持倒空间密度
  kpoints_primitive: [7, 7, 1]

# ---------------------------------------------------------------------------
#  d 带中心分析
# ---------------------------------------------------------------------------
dband:
  # 积分区间（相对费米能级，E_F = 0）
  #   默认 (-10, 0) = 只积分占据态，这是 d 带中心的标准定义
  #   改 (-10, 6) 则为全带一阶矩约定 —— 一旦选定，所有组分必须一致
  emin: -10.0
  emax: 0.0
  elements: [Ti, V]

# ---------------------------------------------------------------------------
#  吸附
# ---------------------------------------------------------------------------
adsorption:
  species: [H, Li, Na, K]
  site: Otop               # Otop (H 吸附在表面 O 上形成 -OH) / hollow (阳离子)
  both_sides: true         # 双面吸附，保持 slab 对称、净偶极为零

  # 参考态能量 (eV/atom)。**必须自己算** —— 赝势与泛函相关，不可照抄文献
  #   H : 1/2 * E(H2 分子)，即计算氢电极 (CHE) 约定
  #   Li/Na/K : 体相金属单原子能量
  references:
    H: null
    Li: null
    Na: null
    K: null

  # 算完后把 E_ads(y) 存成 [{"y":0.0,"E_ads":-1.85}, ...]，analyze_alloy 会读取
  results_file: null

# ---------------------------------------------------------------------------
#  实测数据（用于与理论交叉验证）
# ---------------------------------------------------------------------------
# 格式: [{"y": 0.0, "C_g": 320.0}, ...]   单位 F/g，来自你的 GCD 测试
experimental:
  capacitance_file: null

# ---------------------------------------------------------------------------
#  能量学分析（E_mix 需要两个端点成员的总能量，单位 eV，按超胞计）
# ---------------------------------------------------------------------------
energetics:
  host_end: null      # E(Ti3C2O2)  —— 即 y=0 那个计算
  dopant_end: null    # E(V3C2O2)   —— 即 y=3 那个（假想端点）

# ---------------------------------------------------------------------------
#  NEB
# ---------------------------------------------------------------------------
neb:
  images: 5                # 移动镜像数（端点另算）
  method: linear           # linear / idpp (idpp 需装 pymatgen)
  spring: -5.0
  climb: true
  optimizer: 3             # IOPT: 1=quick-min, 3=FIRE
  ediffg: -0.03

# ---------------------------------------------------------------------------
#  输出
# ---------------------------------------------------------------------------
output:
  root: MXenes_alloy
  results: results
  dpi: 300
